The title block of the layout "plain" at the top of the first page, with the fields of the front matter.
-->
{{#title}}
<header class="title-block">
  <p class="title">{{title}}</p>
  {{#subtitle}}<p class="subtitle">{{subtitle}}</p>{{/subtitle}}
  {{#author}}<p class="author">{{author}}</p>{{/author}}
  {{#date}}<p class="date">{{date}}</p>{{/date}}
</header>
{{/title}}
